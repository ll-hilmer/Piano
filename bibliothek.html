<meta charset="utf-8">
<title>Notenleser · Bibliothek</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,500;1,6..96,500&family=Figtree:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="shared.css">

<style>
/* Bibliothek: Suchleiste mit Import und Scannen, Filter, Raster aus Notenblatt-Karten.
   Darüber liegen drei Ebenen: Angaben zum Stück, Scanner (Ecken ziehen, Noten säubern) und die Notenansicht. */
:root { --nl-max: 1080px; --sheet: #fdfcf8; --sheet-ink: #1d2133; }
* { box-sizing: border-box; }
body { background: var(--paper); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.5; margin: 0; }
.wrap {
  max-width: 1080px; margin: 0 auto; display: grid; gap: 16px;
  padding-block: 22px 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
h1 { font-family: var(--font-display); font-weight: 500; font-style: italic; font-size: clamp(2rem, 6vw, 2.6rem); line-height: 1.05; margin: 0; }
.tagline { color: var(--muted); margin: 4px 0 0; }
button, input, select { font: inherit; color: inherit; }
.muted { color: var(--muted); }

.toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.search { flex: 1 1 260px; min-width: 0; display: flex; align-items: center; gap: 8px; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 0 12px; }
.search .ic { color: var(--muted); }
.search input { flex: 1; min-width: 0; border: 0; background: transparent; padding: 10px 0; outline: none; }
.search:focus-within { outline: 3px solid var(--accent); outline-offset: 2px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border-radius: 10px; padding: 9px 14px; font-weight: 600; border: 1px solid var(--line); background: var(--card); color: var(--ink); cursor: pointer; text-decoration: none; white-space: nowrap; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--card); }
.btn.danger { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 40%, var(--line)); }
.btn.danger.armed { background: var(--bad); color: var(--card); border-color: var(--bad); }
.btn.small { padding: 6px 10px; font-size: 0.88rem; }
.btn[disabled] { opacity: .5; cursor: default; }
.btn .ic { width: 18px; height: 18px; }
.btn:focus-visible, .chip:focus-visible, .card:focus-visible, select:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.file-in { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }

.filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.chip { border: 1px solid var(--line); background: var(--card); color: var(--muted); border-radius: 999px; padding: 5px 12px; font-weight: 600; font-size: 0.85rem; cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--card); border-color: var(--ink); }
.filters select { border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 5px 10px; font-size: 0.85rem; font-weight: 600; color: var(--muted); max-width: 100%; }
.count { margin-left: auto; color: var(--muted); font-size: 0.85rem; }
.syncline { display: flex; align-items: center; gap: 8px; font-size: 0.85rem; color: var(--muted); }
.syncline .ic { width: 16px; height: 16px; }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 16px; }
.card { display: grid; gap: 7px; align-content: start; color: inherit; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 10px 10px 12px; cursor: pointer; text-align: left; min-width: 0; }
.card:hover { border-color: var(--accent); }
.cover { position: relative; aspect-ratio: 210 / 297; max-width: 100%; width: 100%; border-radius: 6px; background: var(--sheet); border: 1px solid var(--line); overflow: hidden; display: grid; place-items: center; color: #8a8fa3; font-size: 0.8rem; }
.cover img { width: 100%; height: 100%; object-fit: cover; object-position: top; display: block; }
.cover .cloud { position: absolute; right: 6px; bottom: 6px; background: var(--card); color: var(--muted); border-radius: 999px; padding: 3px; display: grid; box-shadow: 0 1px 2px rgba(0,0,0,.15); }
.cover .cloud .ic { width: 16px; height: 16px; }
.cover .cloud.ok { color: var(--good); }
.card h3 { margin: 0; font-size: 1rem; line-height: 1.25; text-wrap: balance; overflow-wrap: anywhere; }
.card .who { color: var(--muted); font-size: 0.85rem; overflow-wrap: anywhere; }
.meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.dots { display: inline-flex; gap: 3px; }
.dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--line); }
.dots i.on { background: var(--accent); }
.pill { font-size: 0.72rem; font-weight: 600; border-radius: 999px; padding: 1px 8px; white-space: nowrap; }
.pill.sure { background: var(--good-soft); color: var(--good); }
.pill.shaky { background: var(--warn-soft); color: var(--warn); }
.pill.learn { background: var(--accent-soft); color: var(--accent); }
.last { font-size: 0.78rem; color: var(--muted); display: flex; align-items: center; gap: 4px; }
.last .ic { width: 14px; height: 14px; }

.empty { display: grid; justify-items: start; gap: 10px; background: var(--card); border: 1px dashed var(--line); border-radius: 14px; padding: 28px 22px; }
.empty .ic.big { width: 40px; height: 40px; color: var(--accent); }
.empty h2 { margin: 0; font-family: var(--font-display); font-weight: 500; font-size: 1.5rem; }
.empty p { margin: 0; max-width: 62ch; color: var(--muted); }
.empty .row { display: flex; flex-wrap: wrap; gap: 10px; }

/* Ebenen (Dialoge) */
dialog { border: 0; padding: 0; color: var(--ink); background: var(--card); }
dialog::backdrop { background: rgba(10, 12, 24, .55); }
.form-dlg { width: min(560px, calc(100vw - 24px)); max-height: calc(100dvh - 24px); border-radius: 16px; }
.form-dlg form { display: grid; gap: 14px; padding: 20px; }
.form-dlg h2 { margin: 0; font-family: var(--font-display); font-weight: 500; font-size: 1.5rem; }
.field { display: grid; gap: 5px; min-width: 0; }
.field > span { font-size: 0.85rem; font-weight: 600; }
.field input[type=text] { width: 100%; border: 1px solid var(--line); background: var(--paper); border-radius: 9px; padding: 9px 10px; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.seg { display: flex; flex-wrap: wrap; background: var(--paper); border: 1px solid var(--line); border-radius: 9px; padding: 3px; gap: 3px; }
.seg input { position: absolute; opacity: 0; pointer-events: none; }
.seg label { flex: 1; text-align: center; padding: 6px 8px; border-radius: 6px; cursor: pointer; font-size: 0.88rem; color: var(--muted); white-space: nowrap; }
.seg input:checked + label { background: var(--card); color: var(--ink); font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,.12); }
.seg input:focus-visible + label { outline: 3px solid var(--accent); outline-offset: 1px; }
.sugg { display: flex; flex-wrap: wrap; gap: 6px; }
.sugg button { border: 1px dashed var(--line); background: transparent; border-radius: 999px; padding: 2px 10px; font-size: 0.8rem; color: var(--muted); cursor: pointer; }
.actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.actions .spacer { flex: 1; }
.hint { font-size: 0.85rem; color: var(--muted); margin: 0; }

.full { width: 100vw; height: 100dvh; max-width: 100vw; max-height: 100dvh; margin: 0; background: var(--paper); }
.full[open] { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; }
.topbar {
  display: flex; align-items: center; gap: 10px; background: var(--card); border-bottom: 1px solid var(--line);
  padding-block: calc(8px + env(safe-area-inset-top, 0px)) 8px; padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px));
}
.topbar .title { flex: 1; min-width: 0; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.topbar .title small { font-weight: 500; color: var(--muted); margin-left: 6px; }
.iconbtn { border: 1px solid var(--line); background: var(--card); border-radius: 10px; padding: 7px; display: grid; cursor: pointer; color: var(--ink); }
.iconbtn:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

/* Notenansicht */
.stage { position: relative; overflow: hidden; display: grid; place-items: center; background: #6d7186; touch-action: pan-y pinch-zoom; }
.stage canvas { background: var(--sheet); box-shadow: 0 2px 16px rgba(0,0,0,.35); display: block; }
.stage .msg { color: #fff; font-weight: 600; }
.tapzone { position: absolute; top: 0; bottom: 0; width: 30%; border: 0; background: transparent; cursor: pointer; }
.tapzone.prev { left: 0; } .tapzone.next { right: 0; }
.pager {
  display: flex; align-items: center; justify-content: center; gap: 14px; background: var(--card); border-top: 1px solid var(--line);
  padding-block: 8px calc(8px + env(safe-area-inset-bottom, 0px)); font-weight: 600; font-variant-numeric: tabular-nums;
}

/* Scanner */
.scan-stage { position: relative; overflow: hidden; display: grid; place-items: center; background: #2a2d3a; touch-action: none; }
.scan-stage canvas { display: block; }
.scan-stage svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.scan-stage polygon { fill: rgba(143, 162, 255, .18); stroke: #8fa2ff; stroke-width: 2; }
.scan-stage circle { fill: #fff; stroke: #2d4bd0; stroke-width: 3; cursor: grab; }
.scan-tools {
  display: grid; gap: 8px; background: var(--card); border-top: 1px solid var(--line);
  padding-block: 10px calc(10px + env(safe-area-inset-bottom, 0px)); padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px));
}
.scan-tools .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.strip { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; }
.strip button { flex: none; width: 46px; height: 62px; border-radius: 6px; border: 2px solid transparent; padding: 0; background: #ddd center / cover no-repeat; cursor: pointer; }
.strip button.on { border-color: var(--accent); }
.toggle[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.busy { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(10, 12, 24, .55); color: #fff; font-weight: 600; text-align: center; padding: 20px; }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(84px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--card); padding: 9px 16px; border-radius: 10px; font-weight: 600; max-width: calc(100% - 32px); z-index: 60; }
@media (max-width: 560px) { .two { grid-template-columns: 1fr; } .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; } }
</style>

<nav id="nl-nav"></nav>
<script src="shared.js"></script>

<div class="wrap">
  <header>
    <h1>Bibliothek</h1>
    <p class="tagline">Deine Noten an einem Ort: am PC und auf dem iPad, gesichert in deinem Google Drive.</p>
  </header>

  <div class="toolbar">
    <label class="search"><span id="s-icon"></span><input id="q" type="search" placeholder="Titel, Komponist oder Sammlung suchen" aria-label="Suchen"></label>
    <label class="btn primary" for="pdf-in" id="pdf-btn">PDF importieren</label>
    <label class="btn" for="img-in" id="scan-btn">Scannen</label>
    <input class="file-in" id="pdf-in" type="file" accept="application/pdf,.pdf" multiple>
    <input class="file-in" id="img-in" type="file" accept="image/*" multiple>
  </div>

  <div class="filters" id="filters" aria-label="Filter"></div>
  <div class="syncline" id="syncline" hidden></div>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" hidden></div>
</div>

<!-- Angaben zum Stück -->
<dialog class="form-dlg" id="editor" aria-labelledby="ed-h">
  <form method="dialog" id="ed-form">
    <h2 id="ed-h">Neues Stück</h2>
    <label class="field"><span>Titel</span><input type="text" id="ed-title" required autocomplete="off"></label>
    <div class="two">
      <label class="field"><span>Komponist</span><input type="text" id="ed-composer" list="dl-composer" autocomplete="off"></label>
      <label class="field"><span>Genre</span><input type="text" id="ed-genre" list="dl-genre" autocomplete="off" placeholder="z. B. Filmmusik, Klassik"></label>
    </div>
    <div class="field"><span>Schwierigkeit</span><div class="seg" id="ed-diff"></div></div>
    <div class="field"><span>Stand</span><div class="seg" id="ed-status"></div></div>
    <label class="field"><span>Sammlungen <small class="muted">(mit Komma trennen)</small></span><input type="text" id="ed-coll" autocomplete="off" placeholder="z. B. Repertoire, Unterricht"></label>
    <div class="sugg" id="ed-sugg"></div>
    <p class="hint" id="ed-info"></p>
    <div class="actions">
      <button type="button" class="btn danger" id="ed-delete" hidden>Löschen</button>
      <span class="spacer"></span>
      <button type="button" class="btn" id="ed-cancel">Abbrechen</button>

</dialog>
<datalist id="dl-composer"></datalist>
<datalist id="dl-genre"></datalist>

<!-- Notenansicht -->
<dialog class="full" id="viewer" aria-labelledby="v-title">
  <div class="topbar">
    <button type="button" class="iconbtn" id="v-close" aria-label="Schließen"></button>
    <div class="title" id="v-title"></div>
    <button type="button" class="btn small" id="v-edit">Angaben</button>
  </div>
  <div class="stage" id="v-stage">
    <canvas id="v-canvas"></canvas>
    <button type="button" class="tapzone prev" id="v-prev" aria-label="Vorige Seite"></button>
    <button type="button" class="tapzone next" id="v-next" aria-label="Nächste Seite"></button>
  </div>
  <div class="pager"><button type="button" class="iconbtn" id="v-back" aria-label="Vorige Seite"></button><span id="v-page">1 / 1</span><button type="button" class="iconbtn" id="v-fwd" aria-label="Nächste Seite"></button></div>
</dialog>

<!-- Scanner -->
<dialog class="full" id="scanner" aria-labelledby="sc-title">
  <div class="topbar">
    <button type="button" class="iconbtn" id="sc-close" aria-label="Abbrechen"></button>
    <div class="title" id="sc-title">Scannen</div>
    <button type="button" class="btn small primary" id="sc-done">Fertig</button>

    <div class="row">
      <button type="button" class="btn small toggle" id="sc-clean" aria-pressed="true">Saubere Noten</button>
      <button type="button" class="btn small toggle" id="sc-preview" aria-pressed="false">Ergebnis zeigen</button>
      <button type="button" class="btn small" id="sc-rotate">Drehen</button>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const I = NL.icon;
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const STATE = { learn: 'Lerne ich', shaky: 'Holprig', sure: 'Sitzt' };

  // ---------- PDF.js (Notenansicht und Deckblätter) ----------
  const pdfjs = window.pdfjsLib;
  if (pdfjs) {
    const src = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    try { pdfjs.GlobalWorkerOptions.workerSrc = URL.createObjectURL(new Blob([`importScripts('${src}');`], { type: 'text/javascript' })); }
    catch (e) { pdfjs.GlobalWorkerOptions.workerSrc = src; }
  }
  const openPdf = async blob => pdfjs.getDocument({ data: new Uint8Array(await blob.arrayBuffer()) }).promise;

  // ---------- Speicher auf dem Gerät (IndexedDB): PDFs und Deckblätter ----------
  const idb = (() => {
    let dbp = null;
    const open = () => dbp || (dbp = new Promise((res, rej) => {
      const r = indexedDB.open('notenleser', 1);
      r.onupgradeneeded = () => { r.result.createObjectStore('files'); r.result.createObjectStore('thumbs'); };
      r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
    }));
    const run = (store, mode, fn) => open().then(db => new Promise((res, rej) => {
      const t = db.transaction(store, mode), req = fn(t.objectStore(store));
      t.oncomplete = () => res(req && req.result); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
    }));
    return {
      get: (s, k) => run(s, 'readonly', st => st.get(k)),
      put: (s, k, v) => run(s, 'readwrite', st => st.put(v, k)),
      del: (s, k) => run(s, 'readwrite', st => st.delete(k))
    };
  })();

  // ---------- Bibliothek (Angaben, mit Drive abgeglichen) ----------
  const LIB_KEY = 'nl-library';
  const readLib = () => { try { return JSON.parse(localStorage.getItem(LIB_KEY) || 'null') || { pieces: {} }; } catch (e) { return { pieces: {} }; } };
  let lib = readLib();
  lib.pieces = lib.pieces || {};
  function saveLib() {
    lib._mod = Date.now();
    try { localStorage.setItem(LIB_KEY, JSON.stringify(lib)); } catch (e) { toast('Speichern auf diesem Gerät fehlgeschlagen.'); }
    NL.changed();
  }
  const pieces = () => Object.values(lib.pieces).filter(p => !p.deleted);
  const touch = p => { p.updated = Date.now(); };
  const newId = () => 'p' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  const uniq = arr => [...new Set(arr.filter(Boolean))].sort((a, b) => a.localeCompare(b, 'de'));

  // ---------- Deckblatt aus der ersten Seite ----------
  const thumbUrls = {};
  async function makeThumb(id, blob) {
    const doc = await openPdf(blob);
    const page = await doc.getPage(1);
    const v1 = page.getViewport({ scale: 1 });
    const vp = page.getViewport({ scale: 360 / v1.width });
    const c = document.createElement('canvas');
    c.width = Math.round(vp.width); c.height = Math.round(vp.height);
    const ctx = c.getContext('2d');
    ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);
    await page.render({ canvasContext: ctx, viewport: vp }).promise;
    const t = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.82));
    const pages = doc.numPages;
    doc.destroy();
    await idb.put('thumbs', id, t);
    if (thumbUrls[id]) URL.revokeObjectURL(thumbUrls[id]);
    thumbUrls[id] = URL.createObjectURL(t);
    return pages;
  }
  async function thumbUrl(id) {
    if (thumbUrls[id]) return thumbUrls[id];
    const t = await idb.get('thumbs', id).catch(() => null);
    if (t) thumbUrls[id] = URL.createObjectURL(t);
    return thumbUrls[id] || null;
  }

  // ---------- Filter und Raster ----------
  const view = { genre: 'Alle', coll: '', level: '0', status: '', sort: 'title' };
  try { Object.assign(view, JSON.parse(localStorage.getItem('nl-lib-view') || '{}')); } catch (e) {}
  const days = t => Math.floor((Date.now() - t) / 86400000);
  const ago = t => { if (!t) return 'noch nie geöffnet'; const n = days(t); return n <= 0 ? 'heute geöffnet' : n === 1 ? 'gestern geöffnet' : `vor ${n} Tagen geöffnet`; };

  function renderFilters() {
    const ps = pieces();
    const genres = ['Alle', ...uniq(ps.map(p => p.genre))];
    if (!genres.includes(view.genre)) view.genre = 'Alle';
    const colls = uniq(ps.flatMap(p => p.collections || []));
    if (view.coll && !colls.includes(view.coll)) view.coll = '';
    $('filters').hidden = !ps.length;
    $('filters').innerHTML = genres.map(g => `<button type="button" class="chip" data-g="${esc(g)}" aria-pressed="${g === view.genre}">${esc(g)}</button>`).join('')
      + (colls.length ? `<select id="f-coll" aria-label="Sammlung"><option value="">Alle Sammlungen</option>${colls.map(c => `<option value="${esc(c)}" ${c === view.coll ? 'selected' : ''}>${esc(c)}</option>`).join('')}</select>` : '')
      + `<select id="f-lvl" aria-label="Schwierigkeit"><option value="0">Jede Schwierigkeit</option>${[1, 2, 3, 4, 5].map(n => `<option value="${n}" ${String(n) === view.level ? 'selected' : ''}>Schwierigkeit ${n}</option>`).join('')}</select>`
      + `<select id="f-status" aria-label="Stand"><option value="">Jeder Stand</option>${Object.entries(STATE).map(([k, v]) => `<option value="${k}" ${k === view.status ? 'selected' : ''}>${v}</option>`).join('')}</select>`
      + `<select id="f-sort" aria-label="Sortierung">${[['title', 'A–Z'], ['composer', 'Komponist'], ['opened', 'Zuletzt geöffnet'], ['stale', 'Lange nicht geöffnet'], ['added', 'Neu hinzugefügt'], ['diff', 'Schwierigkeit']].map(([k, v]) => `<option value="${k}" ${k === view.sort ? 'selected' : ''}>${v}</option>`).join('')}</select>`
      + `<span class="count" id="count"></span>`;
    const keep = () => { try { localStorage.setItem('nl-lib-view', JSON.stringify(view)); } catch (e) {} renderGrid(); };
    $('filters').querySelectorAll('[data-g]').forEach(b => b.addEventListener('click', () => { view.genre = b.dataset.g; renderFilters(); keep(); }));
    const sel = (id, k) => { const el = $(id); if (el) el.addEventListener('change', () => { view[k] = el.value; keep(); }); };
    sel('f-coll', 'coll'); sel('f-lvl', 'level'); sel('f-status', 'status'); sel('f-sort', 'sort');
  }
  async function renderGrid() {
    const ps = pieces();
    $('empty').hidden = ps.length > 0;

  async function syncFiles() {
    if (filesBusy) return;

    if (!NL.ready()) { syncLine(pendingUp ? `${pendingUp} ${pendingUp === 1 ? 'Stück wartet' : 'Stücke warten'} auf das Hochladen (keine Verbindung zu Google Drive).` : '', 'cloudOff'); return; }
    filesBusy = true;
    let changed = false;
    try {
      const folder = await NL.ensureSetup();
      const todo = all.filter(p => (p.deleted && p.fileId && !p.trashed) || (!p.deleted && (!p.fileId || p.rename)));
      let n = 0;
      for (const p of todo) {
        n++;
        if (p.deleted) {
          syncLine(`Lösche „${p.title}“ in Google Drive …`);
          // In den Papierkorb von Drive (30 Tage wiederherstellbar)
          await NL.api(`/drive/v3/files/${p.fileId}`, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ trashed: true }) }).catch(e => { if (e.code !== 404) throw e; });

          const blob = await idb.get('files', p.id);
          if (!blob) continue;
          syncLine(`Lade hoch: „${p.title}“ (${n} von ${todo.length}) …`, 'upload');
          const bd = 'nl' + Math.random().toString(36).slice(2);
          const meta = { name: fileName(p), parents: [folder], mimeType: 'application/pdf' };
          const body = new Blob([`--${bd}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(meta)}\r\n--${bd}\r\nContent-Type: application/pdf\r\n\r\n`, blob, `\r\n--${bd}--`]);

  // Lineares Gleichungssystem für die Entzerrung (Zielrechteck → Fotoviereck)
  function homography(dst, src) {
    const A = [], b = [];
    for (let i = 0; i < 4; i++) {
      const [x, y] = dst[i], [u, v] = src[i];
      A.push([x, y, 1, 0, 0, 0, -u * x, -u * y]); b.push(u);
      A.push([0, 0, 0, x, y, 1, -v * x, -v * y]); b.push(v);
    }
    for (let c = 0; c < 8; c++) {
      let p = c; for (let r = c + 1; r < 8; r++) if (Math.abs(A[r][c]) > Math.abs(A[p][c])) p = r;
      [A[c], A[p]] = [A[p], A[c]]; [b[c], b[p]] = [b[p], b[c]];
      for (let r = 0; r < 8; r++) {
        if (r === c) continue;
        const f = A[r][c] / A[c][c];
        for (let k = c; k < 8; k++) A[r][k] -= f * A[c][k];
        b[r] -= f * b[c];
      }
    }
    return b.map((v, i) => v / A[i][i]);
  }
  // Seite entzerren (DIN-A4-Format) und auf Wunsch säubern: Papier weiß, Noten schwarz, Schatten weg
  function processPage(pg, outW) {
    const outH = Math.round(outW * Math.SQRT2);
    const sw = pg.src.width, sh = pg.src.height;
    const sd = pg.src.getContext('2d').getImageData(0, 0, sw, sh).data;
    const h = homography([[0, 0], [outW, 0], [outW, outH], [0, outH]], pg.corners);
    const out = document.createElement('canvas'); out.width = outW; out.height = outH;
    const octx = out.getContext('2d');
    const img = octx.createImageData(outW, outH), od = img.data;
    const gray = pg.clean ? new Float32Array(outW * outH) : null;
    for (let y = 0; y < outH; y++) {
      for (let x = 0; x < outW; x++) {
        const den = h[6] * x + h[7] * y + 1;
        let u = (h[0] * x + h[1] * y + h[2]) / den, v = (h[3] * x + h[4] * y + h[5]) / den;
        u = Math.min(sw - 1.001, Math.max(0, u)); v = Math.min(sh - 1.001, Math.max(0, v));
        const x0 = u | 0, y0 = v | 0, fx = u - x0, fy = v - y0;
        const i00 = (y0 * sw + x0) * 4, i10 = i00 + 4, i01 = i00 + sw * 4, i11 = i01 + 4;
        const o = (y * outW + x) * 4;
        for (let ch = 0; ch < 3; ch++) {
          od[o + ch] = (sd[i00 + ch] * (1 - fx) + sd[i10 + ch] * fx) * (1 - fy) + (sd[i01 + ch] * (1 - fx) + sd[i11 + ch] * fx) * fy;
        }
        od[o + 3] = 255;
        if (gray) gray[y * outW + x] = 0.299 * od[o] + 0.587 * od[o + 1] + 0.114 * od[o + 2];
      }
    }
    if (gray) {
      // Hintergrund (Papierhelligkeit) grob schätzen: hellster Wert je Block, geglättet
      const B = 24, bw = Math.ceil(outW / B), bh = Math.ceil(outH / B);
      const bg = new Float32Array(bw * bh);
      for (let by = 0; by < bh; by++) for (let bx = 0; bx < bw; bx++) {
        let m = 0;
        for (let y = by * B; y < Math.min(outH, by * B + B); y += 2) for (let x = bx * B; x < Math.min(outW, bx * B + B); x += 2) { const g = gray[y * outW + x]; if (g > m) m = g; }
        bg[by * bw + bx] = m;
      }
      const sm = new Float32Array(bw * bh);
      for (let by = 0; by < bh; by++) for (let bx = 0; bx < bw; bx++) {
        let s = 0, n = 0;
        for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) { const yy = by + dy, xx = bx + dx; if (yy >= 0 && yy < bh && xx >= 0 && xx < bw) { s += bg[yy * bw + xx]; n++; } }
        sm[by * bw + bx] = Math.max(40, s / n);
      }
      for (let y = 0; y < outH; y++) {
        const fy = Math.min(bh - 1.001, Math.max(0, y / B - 0.5)), y0 = fy | 0, ty = fy - y0;
        for (let x = 0; x < outW; x++) {
          const fx = Math.min(bw - 1.001, Math.max(0, x / B - 0.5)), x0 = fx | 0, tx = fx - x0;
          const b0 = sm[y0 * bw + x0] * (1 - tx) + sm[y0 * bw + x0 + 1] * tx, b1 = sm[(y0 + 1) * bw + x0] * (1 - tx) + sm[(y0 + 1) * bw + x0 + 1] * tx;
          const ratio = gray[y * outW + x] / (b0 * (1 - ty) + b1 * ty);
          const t = Math.min(1, Math.max(0, (ratio - 0.52) / 0.33));
          const val = 255 * t * t * (3 - 2 * t);
          const o = (y * outW + x) * 4;
          od[o] = od[o + 1] = od[o + 2] = val;
        }
      }
    }
    octx.putImageData(img, 0, 0);
    return out;
  }
  // Anzeige: Foto mit Ecken, oder das Ergebnis
  let shown = null;   // { scale, ox, oy } von Foto- zu Bildschirmkoordinaten
  function drawScan() {
    const pg = S.pages[S.cur];
    const c = $('sc-canvas'), svg = $('sc-svg'), st = $('sc-stage');
    $('sc-title').textContent = S.pages.length ? `Scannen · Seite ${S.cur + 1} von ${S.pages.length}` : 'Scannen';
    $('sc-clean').setAttribute('aria-pressed', String(!!(pg && pg.clean)));
    if (!pg) { c.width = c.height = 1; svg.innerHTML = ''; return; }
    const img = S.preview ? processPage(pg, 700) : pg.src;
    const k = Math.min((st.clientWidth - 24) / img.width, (st.clientHeight - 24) / img.height);
    c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
    c.style.width = c.width + 'px'; c.style.height = c.height + 'px';
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    if (S.preview) { svg.innerHTML = ''; shown = null; return; }
    const r = c.getBoundingClientRect(), sr = st.getBoundingClientRect();
    shown = { kx: r.width / img.width, ky: r.height / img.height, ox: r.left - sr.left, oy: r.top - sr.top };
    svg.innerHTML = '<polygon/>' + [0, 1, 2, 3].map(i => `<circle data-i="${i}" r="13"/>`).join('');
    placeCorners();
  }
  // Nur die Punkte verschieben (beim Ziehen nichts neu aufbauen, sonst geht der Finger verloren)
  function placeCorners() {
    const pg = S.pages[S.cur], svg = $('sc-svg');
    if (!pg || !shown) return;
    const pts = pg.corners.map(([x, y]) => [shown.ox + x * shown.kx, shown.oy + y * shown.ky]);
    svg.querySelector('polygon').setAttribute('points', pts.map(p => p.join(',')).join(' '));
    svg.querySelectorAll('circle').forEach((c, i) => { c.setAttribute('cx', pts[i][0]); c.setAttribute('cy', pts[i][1]); });
  }
  function renderStrip() {
    $('sc-strip').innerHTML = S.pages.map((pg, i) => `<button type="button" class="${i === S.cur ? 'on' : ''}" data-i="${i}" aria-label="Seite ${i + 1}" style="background-image:url(${pg.thumb || (pg.thumb = pg.src.toDataURL('image/jpeg', 0.5))})"></button>`).join('');
    $('sc-strip').querySelectorAll('button').forEach(b => b.addEventListener('click', () => { S.cur = +b.dataset.i; renderStrip(); drawScan(); }));
  }
  $('sc-svg').addEventListener('pointerdown', e => {
    const i = e.target.dataset && e.target.dataset.i;
    if (i === undefined || !shown) return;
    S.drag = +i; e.target.setPointerCapture(e.pointerId); e.preventDefault();
  });
  $('sc-svg').addEventListener('pointermove', e => {
    if (S.drag < 0 || !shown) return;
    const pg = S.pages[S.cur], sr = $('sc-stage').getBoundingClientRect();
    const x = (e.clientX - sr.left - shown.ox) / shown.kx, y = (e.clientY - sr.top - shown.oy) / shown.ky;
    pg.corners[S.drag] = [Math.min(pg.src.width, Math.max(0, x)), Math.min(pg.src.height, Math.max(0, y))];
    placeCorners();
  });
  const endDrag = () => { S.drag = -1; };
  window.addEventListener('pointerup', endDrag);
  window.addEventListener('pointercancel', endDrag);
  $('sc-clean').addEventListener('click', () => { const pg = S.pages[S.cur]; if (pg) { pg.clean = !pg.clean; drawScan(); } });
  $('sc-preview').addEventListener('click', () => { S.preview = !S.preview; $('sc-preview').setAttribute('aria-pressed', String(S.preview)); drawScan(); });
  $('sc-reset').addEventListener('click', () => { const pg = S.pages[S.cur]; if (pg) { pg.corners = defaultCorners(pg.src); drawScan(); } });
  $('sc-rotate').addEventListener('click', () => {
    const pg = S.pages[S.cur]; if (!pg) return;
    const c = document.createElement('canvas'); c.width = pg.src.height; c.height = pg.src.width;
    const ctx = c.getContext('2d'); ctx.translate(c.width, 0); ctx.rotate(Math.PI / 2); ctx.drawImage(pg.src, 0, 0);
    pg.src = c; pg.corners = defaultCorners(c); pg.thumb = null;
    renderStrip(); drawScan();
  });
  $('sc-remove').addEventListener('click', () => {
    S.pages.splice(S.cur, 1);
    if (!S.pages.length) { $('scanner').close(); return; }
    S.cur = Math.min(S.cur, S.pages.length - 1); renderStrip(); drawScan();
  });
  $('sc-close').addEventListener('click', () => $('scanner').close());
  $('scanner').addEventListener('close', () => { S.pages = []; });
  // Bei jeder Größenänderung der Fläche (Drehen des iPads, Seitenleiste) neu zeichnen
  new ResizeObserver(() => { if ($('scanner').open && S.drag < 0) drawScan(); }).observe($('sc-stage'));
  function loadJsPdf() {
    if (window.jspdf) return Promise.resolve(window.jspdf);
    return new Promise((res, rej) => {
      const s = document.createElement('script');
      s.src = 'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';
      s.onload = () => res(window.jspdf); s.onerror = () => rej(new Error('PDF-Erstellung konnte nicht geladen werden. Prüfe die Internetverbindung.'));
      document.head.appendChild(s);
    });
  }
  $('sc-done').addEventListener('click', async () => {
    if (!S.pages.length) return;
    const busy = document.createElement('div'); busy.className = 'busy';
    $('sc-stage').appendChild(busy);
    try {
      const { jsPDF } = await loadJsPdf();
      const doc = new jsPDF({ unit: 'pt', format: 'a4', compress: true });
      for (const [i, pg] of S.pages.entries()) {
        busy.textContent = `Seite ${i + 1} von ${S.pages.length} wird aufbereitet …`;
        await new Promise(r => setTimeout(r, 30));
        const out = processPage(pg, 1240);
        if (i) doc.addPage();
        doc.addImage(out.toDataURL('image/jpeg', 0.85), 'JPEG', 0, 0, 595.28, 841.89, undefined, 'FAST');
      }
      const blob = doc.output('blob');
      const n = S.pages.length;
      $('scanner').close();
      await addPdf(blob, { title: `Scan vom ${new Date().toLocaleDateString('de-DE')}` }, `${n} ${n === 1 ? 'Seite' : 'Seiten'} gescannt`);
    } catch (e) { busy.textContent = e.message || 'Das hat nicht geklappt.'; setTimeout(() => busy.remove(), 2500); return; }
    busy.remove();
  });

  // ---------- Kleinigkeiten ----------
  let toastTimer = 0;
  function toast(t) {
    let el = document.querySelector('.toast');
    if (!el) { el = document.createElement('div'); el.className = 'toast'; el.setAttribute('role', 'status'); document.body.appendChild(el); }
    el.textContent = t; el.hidden = false;
    clearTimeout(toastTimer); toastTimer = setTimeout(() => { el.hidden = true; }, 2600);
  }
  $('s-icon').innerHTML = I('search');
  $('pdf-btn').innerHTML = `${I('upload')}PDF importieren`;
  $('scan-btn').innerHTML = `${I('camera')}Scannen`;
  $('v-close').innerHTML = I('arrow').replace('<path d="M5 12h14M13 6l6 6-6 6"/>', '<path d="M19 12H5M11 6l-6 6 6 6"/>');
  $('sc-close').innerHTML = $('v-close').innerHTML;
  $('v-back').innerHTML = $('v-close').innerHTML;
  $('v-fwd').innerHTML = I('arrow');
  ['pdf-btn', 'scan-btn'].forEach(id => $(id).addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); $(id).click(); } }));
  $('pdf-btn').tabIndex = 0; $('scan-btn').tabIndex = 0;

  render();
  syncFiles();
})();
</script>
