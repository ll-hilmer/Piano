<style>
/* Startseite: Begrüßung, „Weiter üben“, Schnellstart, Kennzahlen, Übungskalender, Drive-Konto. Eine Spalte, Karten nur für die Bereiche. */
* { box-sizing: border-box; }
body { background: var(--paper); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.5; margin: 0; }
.wrap {
  max-width: 860px; margin: 0 auto; display: grid; gap: 18px;
  padding-block: 22px 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
h1 { font-family: var(--font-display); font-weight: 500; font-style: italic; font-size: clamp(2rem, 6vw, 2.6rem); line-height: 1.05; margin: 0; text-wrap: balance; }
.date { color: var(--muted); margin: 4px 0 0; }
.panel { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: grid; gap: 12px; min-width: 0; }
.panel h2 { margin: 0; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); font-weight: 600; display: flex; align-items: center; gap: 8px; }
.panel h2 .ic { width: 16px; height: 16px; }
.muted { color: var(--muted); }
a { color: var(--accent); }
button { font: inherit; cursor: pointer; }
.btn { display: inline-flex; align-items: center; gap: 8px; border-radius: 10px; padding: 9px 16px; font-weight: 600; text-decoration: none; border: 1px solid var(--line); background: var(--card); color: var(--ink); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--card); }
.btn:focus-visible, .tile:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.btn[disabled] { opacity: .5; cursor: default; }
.btn .ic { width: 18px; height: 18px; }

/* Weiter üben */
.resume { display: flex; flex-wrap: wrap; align-items: center; gap: 14px 18px; background: var(--accent-soft); border-color: transparent; }
.resume .badge { width: 52px; height: 52px; border-radius: 14px; background: var(--accent); color: var(--card); display: grid; place-items: center; flex: none; }
.resume .badge .ic { width: 26px; height: 26px; }
.resume .txt { flex: 1 1 220px; min-width: 0; }
.resume .eyebrow { font-size: 0.75rem; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
.resume b { display: block; font-size: 1.2rem; }

/* Schnellstart */
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
.tile {
  display: grid; gap: 6px; justify-items: start; padding: 14px; border-radius: 12px; border: 1px solid var(--line);
  background: var(--card); color: var(--ink); text-decoration: none; font-weight: 600; min-width: 0;
}
.tile .ic { color: var(--accent); width: 24px; height: 24px; }
.tile small { color: var(--muted); font-weight: 500; font-size: 0.8rem; }
.tile:hover { border-color: var(--accent); }

/* Kennzahlen */
.kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.kpi { display: grid; gap: 2px; padding: 12px 14px; border-radius: 12px; background: var(--paper); min-width: 0; }
.kpi b { font-size: 1.6rem; line-height: 1.1; font-variant-numeric: tabular-nums; display: flex; align-items: center; gap: 6px; }
.kpi b .ic { width: 22px; height: 22px; color: var(--warn); }
.kpi span { font-size: 0.78rem; color: var(--muted); }

/* Übungskalender: Wochen als Spalten, Mo–So als Zeilen */
.cal-wrap { overflow-x: auto; }
.cal { display: grid; grid-auto-flow: column; grid-template-rows: auto repeat(7, 13px); gap: 3px; width: max-content; }
.cal .m { font-size: 0.68rem; color: var(--muted); height: 14px; white-space: nowrap; }
.cal i { width: 13px; height: 13px; border-radius: 3px; background: var(--paper); border: 1px solid var(--line); display: block; }
.cal i.l1 { background: color-mix(in srgb, var(--good) 30%, var(--card)); border-color: transparent; }
.cal i.l2 { background: color-mix(in srgb, var(--good) 60%, var(--card)); border-color: transparent; }
.cal i.l3 { background: var(--good); border-color: transparent; }
.cal i.today { outline: 2px solid var(--accent); outline-offset: 1px; }
.cal i.future { visibility: hidden; }
.legend { display: flex; align-items: center; gap: 4px; font-size: 0.75rem; color: var(--muted); }
.legend i { width: 11px; height: 11px; border-radius: 3px; display: inline-block; }

/* Vorschau künftiger Funktionen */
/* Stück des Tages */
.daily { display: grid; grid-template-columns: auto 1fr; gap: 14px 18px; align-items: start; }
.daily .cover { width: 92px; aspect-ratio: 210 / 297; border-radius: 6px; border: 1px solid var(--line); background: #fdfcf8; overflow: hidden; display: grid; place-items: center; color: #8a8fa3; }
.daily .cover img { width: 100%; height: 100%; object-fit: cover; object-position: top; display: block; }
.daily .body { display: grid; gap: 6px; min-width: 0; }
.daily .eyebrow { font-size: 0.75rem; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); display: flex; align-items: center; gap: 6px; }
.daily .eyebrow .ic { width: 16px; height: 16px; }
.daily h3 { margin: 0; font-family: var(--font-display); font-weight: 500; font-size: 1.5rem; line-height: 1.15; text-wrap: balance; overflow-wrap: anywhere; }
.daily .why { color: var(--muted); font-size: 0.9rem; }
.daily .row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
.daily .done { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; color: var(--good); }
.next { display: grid; gap: 2px; border-top: 1px solid var(--line); padding-top: 10px; grid-column: 1 / -1; }
.next h4 { margin: 0 0 4px; font-size: 0.72rem; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); }
.next a { display: flex; justify-content: space-between; gap: 12px; padding: 6px 0; color: var(--ink); text-decoration: none; border-radius: 6px; }
.next a:hover b { color: var(--accent); }
.next a span { color: var(--muted); font-size: 0.85rem; white-space: nowrap; }
.next a.over span { color: var(--warn); }
.spotnext { border-top: 0; padding-top: 0; }
.spotnext a span b { color: var(--ink); }
.pill.sure { background: var(--good-soft); color: var(--good); border-color: transparent; }
.pill.shaky { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
.pill.learn { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
.kpi small { font-size: 0.72rem; color: var(--muted); }
@media (max-width: 480px) { .daily { grid-template-columns: 1fr; } .daily .cover { width: 120px; } }
.pill { font-size: 0.72rem; font-weight: 600; border-radius: 999px; padding: 2px 9px; background: var(--paper); color: var(--muted); border: 1px solid var(--line); white-space: nowrap; }

/* Drive-Konto */
.acct { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; }
.acct .who { flex: 1 1 240px; min-width: 0; }
.acct .who b { display: block; overflow-wrap: anywhere; }
.state { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; }
.state.ok { color: var(--good); } .state.warn { color: var(--warn); }
.steps { margin: 0; padding-left: 1.3em; display: grid; gap: 8px; max-width: 70ch; }
.code { display: flex; gap: 6px; align-items: center; margin-top: 4px; }
.code code { flex: 1; min-width: 0; overflow-wrap: anywhere; background: var(--paper); border: 1px solid var(--line); border-radius: 8px; padding: 5px 8px; font-size: 0.85rem; }
.code button { border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 8px; padding: 5px; display: grid; }
.idrow { display: flex; flex-wrap: wrap; gap: 8px; }
.idrow input { flex: 1 1 260px; min-width: 0; font: inherit; color: var(--ink); background: var(--paper); border: 1px solid var(--line); border-radius: 9px; padding: 8px 10px; }
.note { font-size: 0.88rem; color: var(--muted); max-width: 70ch; margin: 0; }
details summary { cursor: pointer; color: var(--muted); font-size: 0.88rem; }

@media (max-width: 640px) {
  .tiles, .kpis { grid-template-columns: repeat(2, 1fr); }
}
</style>

<script src="shared.js"></script>

<div class="wrap">
  <header>
    <h1 id="hello">Hallo</h1>
    <p class="date" id="date"></p>
  </header>

  <section class="panel" aria-labelledby="h-daily">
    <div class="daily" id="daily"></div>
  </section>

  <section class="panel" aria-labelledby="h-focus">
    <h2 id="h-focus"><span id="focus-icon"></span>Fokus-Timer</h2>
    <div id="focus"></div>
  </section>

  <section class="panel" id="spots-card" aria-labelledby="h-spots" hidden>
    <h2 id="h-spots"><span id="spots-icon"></span>Übestellen</h2>
    <div class="next spotnext" id="spotlist"></div>
  </section>

  <section class="panel resume" aria-label="Weiter üben">
    <div class="badge" id="resume-icon"></div>
    <div class="txt">
      <div class="eyebrow">Weiter üben</div>
      <b id="resume-title">Einzelnoten</b>
      <span class="muted" id="resume-detail"></span>
    </div>
    <a class="btn primary" href="ueben.html" id="resume-go"></a>
  </section>

  <section class="panel" aria-labelledby="h-quick">
    <h2 id="h-quick">Schnellstart</h2>
    <div class="tiles" id="tiles"></div>
  </section>

  <section class="panel" aria-labelledby="h-week">
    <h2 id="h-week"><span id="cal-icon"></span>Dein Üben</h2>
    <div class="kpis">
      <div class="kpi"><b id="k-streak">0</b><span>Tage in Folge</span><small id="k-joker"></small></div>
      <div class="kpi"><b id="k-week">0 / 7</b><span>Tage diese Woche</span></div>
      <div class="kpi"><b id="k-today">0</b><span>Antworten heute</span></div>
      <div class="kpi"><b id="k-best">0</b><span>Rekord: richtig in Folge</span></div>
    </div>
    <div class="cal-wrap"><div class="cal" id="cal" role="img" aria-label="Übungskalender der letzten Wochen"></div></div>
    <div class="legend"><span>weniger</span><i style="background:var(--paper);border:1px solid var(--line)"></i><i style="background:color-mix(in srgb, var(--good) 30%, var(--card))"></i><i style="background:color-mix(in srgb, var(--good) 60%, var(--card))"></i><i style="background:var(--good)"></i><span>mehr</span></div>
  </section>

  <section class="panel" id="konto" aria-labelledby="h-konto">
    <h2 id="h-konto"><span id="konto-icon"></span>Google Drive</h2>
    <div id="konto-body"></div>
  </section>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const I = NL.icon;
  const read = k => { try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch (e) { return null; } };
  const dayKey = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;

  // ---------- Begrüßung ----------
  const now = new Date();
  const h = now.getHours();
  $('hello').textContent = h < 11 ? 'Guten Morgen' : h < 18 ? 'Guten Tag' : 'Guten Abend';
  $('date').textContent = now.toLocaleDateString('de-DE', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });

  // ---------- Schnellstart ----------
  const QUICK = [
    ['music', 'Einzelnoten', 'Beide Schlüssel', 'ueben-noten'],
    ['bibliothek', 'Stücke', 'Echte Musik im Takt', 'ueben-stuecke'],
    ['chord', 'Akkordsymbole', 'Am, G7, F/A …', 'ueben-akkordsymbole'],
    ['clock', 'Rhythmus', 'Nur tippen', 'ueben-rhythmus'],
    ['play', 'Vom Blatt', 'Neue Stücke am E-Piano', 'bibliothek.html#vomblatt']
  ];
  $('tiles').innerHTML = QUICK.map(([ic, t, s, id]) => `<a class="tile" href="${id.includes('.html') ? id : 'ueben.html#' + id}">${I(ic)}<span>${t}</span><small>${s}</small></a>`).join('');
  $('cal-icon').innerHTML = I('calendar');
  $('konto-icon').innerHTML = I('cloud');
  $('resume-icon').innerHTML = I('play');
  $('resume-go').innerHTML = `Weiter ${I('arrow')}`;

  const TASKS = { notes: 'Einzelnoten', chords: 'Akkorde', melody: 'Melodie', pieces: 'Stücke', symbols: 'Akkordsymbole', anchors: 'Ankernoten', intervals: 'Intervalle' };
  const CLEF = { treble: 'Violinschlüssel', bass: 'Bassschlüssel', both: 'beide Schlüssel' };

  function renderStats() {
    const st = read('notenleser-v1') || {};
    const s = st.settings || {};
    const task = s.task || 'notes';
    $('resume-title').textContent = TASKS[task] || 'Einzelnoten';
    const bits = [];
    if (['notes', 'chords', 'melody', 'anchors', 'intervals'].includes(task)) bits.push(CLEF[s.clef || 'treble']);
    if (task === 'melody' && s.hands === 'two') bits.push('beide Hände');
    if ((task === 'melody' && s.rhythm && s.rhythm !== 'off') || (task === 'notes' && s.nrhythm && s.nrhythm !== 'off')) bits.push('mit Rhythmus');
    if (task === 'pieces') bits.push(s.prhythm === 'off' ? 'Note für Note' : 'im Takt');
    if (task === 'symbols') bits.push(['', 'Dur & Moll', 'mit Septakkorden', 'mit sus, vermindert, Slash'][+(s.symlevel || 1)]);
    $('resume-detail').textContent = bits.join(' · ') || 'Dort weitermachen, wo du aufgehört hast';

    // Übungstage
    const days = st.days || {};
    const count = d => NL.dayCount(days[dayKey(d)]);
    const has = d => count(d) > 0;
    const d = new Date(now); d.setHours(12, 0, 0, 0);
    const { streak, jokerUsed } = NL.streak(days);
    $('k-joker').textContent = jokerUsed
      ? `Joker diese Woche genutzt (${new Date(jokerUsed + 'T12:00').toLocaleDateString('de-DE', { weekday: 'short' })})`
      : 'Joker diese Woche noch frei';
    const monday = new Date(d); monday.setDate(d.getDate() - ((d.getDay() + 6) % 7));
    let week = 0;
    for (let k = 0; k < 7; k++) { const x = new Date(monday); x.setDate(monday.getDate() + k); if (x <= d && has(x)) week++; }
    $('k-streak').innerHTML = `${I('flame')}${streak}`;
    $('k-week').textContent = `${week} / 7`;
    $('k-today').textContent = count(d);
    $('k-best').textContent = st.best || 0;

    // Kalender: 20 Wochen bis einschließlich dieser Woche
    const WEEKS = 20;
    const start = new Date(monday); start.setDate(monday.getDate() - 7 * (WEEKS - 1));
    let html = '', lastMonth = -1;
    for (let w = 0; w < WEEKS; w++) {
      const first = new Date(start); first.setDate(start.getDate() + 7 * w);
      const m = first.getMonth();
      html += `<span class="m">${m !== lastMonth ? first.toLocaleDateString('de-DE', { month: 'short' }) : ''}</span>`;
      lastMonth = m;
      for (let k = 0; k < 7; k++) {
        const x = new Date(first); x.setDate(first.getDate() + k);
        const n = count(x);
        const lvl = n === 0 ? '' : n < 20 ? 'l1' : n < 60 ? 'l2' : 'l3';
        const cls = [lvl, dayKey(x) === dayKey(d) ? 'today' : '', x > d ? 'future' : ''].join(' ').trim();
        html += `<i class="${cls}" title="${x.toLocaleDateString('de-DE', { weekday: 'short', day: 'numeric', month: 'short' })}: ${n} Antworten"></i>`;
      }
    }
    $('cal').innerHTML = html;
  }

  // ---------- Google Drive ----------
  const ORIGIN = NL.embedded ? 'https://ll-hilmer.github.io' : location.origin;
  const REDIRECT = NL.embedded ? 'https://ll-hilmer.github.io/Piano/' : NL.redirectUri();
  const copyBtn = text => `<button type="button" class="copy" data-copy="${text}" title="Kopieren" aria-label="Kopieren">${I('copy')}</button>`;
  function renderKonto() {
    const box = $('konto-body');
    const s = NL.status(), cfg = NL.cfg();
    const when = t => (t ? new Date(t).toLocaleString('de-DE', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }) : '–');
    let html = '';
    if (NL.embedded) html += `<p class="note">Die Anmeldung bei Google funktioniert nur auf deiner Webseite <b>ll-hilmer.github.io/Piano</b> bzw. in der App auf dem Home-Bildschirm, nicht in dieser Vorschau.</p>`;
    if (!NL.clientId()) {
      html += `<p class="note">Einmalig einrichten (etwa 10 Minuten). Danach werden Fortschritt und später deine Noten zwischen PC und iPad abgeglichen. Die Daten liegen in deinem eigenen Google Drive.</p>
        <ol class="steps">
          <li><a href="https://console.cloud.google.com/projectcreate" target="_blank" rel="noopener">Google Cloud Console</a> öffnen und ein neues Projekt „Klavier-App“ anlegen.</li>
          <li>Im Menü <b>APIs &amp; Dienste → Bibliothek</b> nach „Google Drive API“ suchen und <b>Aktivieren</b>.</li>
          <li>Im Menü <b>Google Auth Platform</b> (früher „OAuth-Zustimmungsbildschirm“) auf <b>Jetzt starten</b>: App-Name „Klavier-App“, deine E-Mail, Zielgruppe <b>Extern</b>.</li>
          <li>Unter <b>Zielgruppe → Testnutzer</b> deine Google-Adresse eintragen. Den Status „Testen“ so lassen: Dann kann sich nur diese Adresse anmelden.</li>
          <li>Unter <b>Clients → Client erstellen</b>: Typ <b>Webanwendung</b>.
            <div>Autorisierte JavaScript-Quellen:</div><div class="code"><code>${ORIGIN}</code>${copyBtn(ORIGIN)}</div>
            <div>Autorisierte Weiterleitungs-URIs:</div><div class="code"><code>${REDIRECT}</code>${copyBtn(REDIRECT)}</div>
          </li>
          <li>Die <b>Client-ID</b> kopieren (endet auf <code>.apps.googleusercontent.com</code>) und hier einfügen:</li>
        </ol>
        <div class="idrow"><input id="client-id" type="text" inputmode="url" autocomplete="off" spellcheck="false" placeholder="123….apps.googleusercontent.com" aria-label="Client-ID"><button type="button" class="btn primary" id="client-save">Speichern</button></div>
        <p class="note" id="client-msg"></p>`;
    } else if (!cfg.connected) {
      html += `<div class="acct"><div class="who"><span class="state">${I('cloudOff')}Nicht verbunden</span>
          <p class="note">Melde dich mit deinem Google-Konto an. Die App sieht nur ihren eigenen Ordner „Klavier-App“ und eine versteckte Datei für deinen Fortschritt, nicht den Rest deines Drives.</p></div>
        <button type="button" class="btn primary" id="g-login" ${NL.embedded ? 'disabled' : ''}>${I('cloud')}Mit Google anmelden</button></div>
        <details><summary>Client-ID ändern</summary><div class="idrow" style="margin-top:8px"><input id="client-id" type="text" autocomplete="off" spellcheck="false" value="${NL.clientId()}" aria-label="Client-ID"><button type="button" class="btn" id="client-save">Speichern</button></div></details>`;
    } else {
      const ok = s.status === 'ok' || s.status === 'syncing';
      const label = { ok: 'Synchron', syncing: 'Abgleich läuft …', expired: 'Anmeldung abgelaufen', offline: 'Offline', error: 'Fehler beim Abgleich' }[s.status] || 'Verbunden';
      html += `<div class="acct"><div class="who">
          <span class="state ${ok ? 'ok' : 'warn'}">${I(ok ? 'cloudOk' : 'cloud')}${label}</span>
          <b>${cfg.name ? cfg.name + ' · ' : ''}${cfg.email || 'Google-Konto'}</b>
          <span class="muted">Zuletzt abgeglichen: ${when(s.lastSync)}</span>
          ${s.msg && !ok ? `<p class="note">${s.msg}</p>` : ''}
        </div>
        <div class="idrow">
          ${s.status === 'expired' ? `<button type="button" class="btn primary" id="g-login">${I('cloud')}Neu anmelden</button>` : `<button type="button" class="btn primary" id="g-sync">${I('refresh')}Jetzt abgleichen</button>`}
          ${s.folderId ? `<a class="btn" href="https://drive.google.com/drive/folders/${s.folderId}" target="_blank" rel="noopener">${I('external')}Ordner öffnen</a>` : ''}
          <button type="button" class="btn" id="g-logout">${I('logout')}Trennen</button>
        </div></div>`;
    }
    box.innerHTML = html;
    const on = (id, f) => { const el = $(id); if (el) el.addEventListener('click', f); };
    on('g-login', () => NL.login(false));
    on('g-sync', () => NL.sync());
    on('g-logout', () => NL.logout());
    on('client-save', () => {
      const v = $('client-id').value.trim();
      if (!/\.apps\.googleusercontent\.com$/.test(v)) { if ($('client-msg')) $('client-msg').textContent = 'Das sieht nicht nach einer Client-ID aus. Sie endet auf .apps.googleusercontent.com.'; return; }
      NL.setClientId(v); renderKonto();
    });
    box.querySelectorAll('[data-copy]').forEach(b => b.addEventListener('click', () => {
      const t = b.dataset.copy;
      const done = () => { b.innerHTML = I('cloudOk'); setTimeout(() => { b.innerHTML = I('copy'); }, 1200); };
      try { navigator.clipboard.writeText(t).then(done, () => {}); } catch (e) {}
    }));
  }

  // ---------- Stück des Tages ----------
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const STATE = { open: 'Offen', learn: 'Lerne ich', shaky: 'Holprig', sure: 'Sitzt' };
  const playHref = id => `bibliothek.html#play-${id}`;
  async function renderDaily(reroll = false) {
    const box = $('daily');
    const lib = NL.lib.read();
    const all = Object.values(lib.pieces).filter(p => !p.deleted);
    const head = `<div class="eyebrow" id="h-daily">${I('shuffle')}Stück des Tages</div>`;
    if (!all.length || !all.some(NL.rep.inPlan)) {
      box.innerHTML = `<div class="cover">${I('bibliothek')}</div><div class="body">${head}
        <h3>${all.length ? 'Noch nichts zum Auffrischen' : 'Noch keine eigenen Noten'}</h3>
        <span class="why">${all.length
          ? 'Stücke mit dem Stand „Sitzt“ oder „Holprig“ kommen hier zum Auffrischen. „Offen“ und „Lerne ich“ bleiben außen vor.'
          : 'Importiere deine Noten in der Bibliothek. Danach schlägt dir die App hier jeden Tag ein Stück zum Auffrischen vor.'}</span>
        <div class="row"><a class="btn primary" href="bibliothek.html">${I('bibliothek')}Zur Bibliothek</a></div></div>`;
      return;
    }
    const p = NL.rep.daily(lib, reroll);
    const done = NL.rep.ratedToday(p);
    const last = p.rep && p.rep.hist && p.rep.hist[p.rep.hist.length - 1];
    const ago = p.opened ? Math.max(0, Math.round((Date.now() - p.opened) / 86400000)) : null;
    const why = [
      ago == null ? 'noch nie gespielt' : ago === 0 ? 'heute geöffnet' : ago === 1 ? 'gestern gespielt' : `vor ${ago} Tagen gespielt`,
      last && !done ? `zuletzt: ${NL.rep.RATE[last.r].toLowerCase()}` : '',
      done ? '' : NL.rep.dueText(p)
    ].filter(Boolean).join(' · ');
    box.innerHTML = `<div class="cover" id="d-cover">${I('music')}</div><div class="body">${head}
      <h3>${esc(p.title)}</h3>
      <span class="why">${esc(p.composer || '')}${p.composer ? ' · ' : ''}<span class="pill ${p.status}">${STATE[p.status]}</span></span>
      <span class="why">${esc(why)}</span>
      <div class="row">${done
        ? `<span class="done">${I('cloudOk')}Heute gespielt: ${NL.rep.RATE[last.r]}</span><button type="button" class="btn" id="d-more">${I('shuffle')}Noch eins</button>`
        : `<a class="btn primary" href="${playHref(p.id)}" id="d-play">${I('play')}Spielen</a><button type="button" class="btn" id="d-other">${I('shuffle')}Anderes Stück</button>`}</div></div>`;
    const next = NL.rep.ranked(lib, [p.id]).slice(0, 4);
    if (next.length) box.innerHTML += `<div class="next"><h4>Als Nächstes wiederholen</h4>${next.map(q => `<a href="${playHref(q.id)}" class="${NL.rep.daysUntil(q) < 0 ? 'over' : ''}"><b>${esc(q.title)}</b><span>${NL.rep.dueText(q)}</span></a>`).join('')}</div>`;
    box.querySelectorAll('a[href^="bibliothek.html#play-"]').forEach(a => a.addEventListener('click', () => { try { sessionStorage.setItem('nl-from-heute', '1'); } catch (e) {} }));
    const other = $('d-other') || $('d-more');
    if (other) other.addEventListener('click', () => renderDaily(true));
    const url = await NL.thumb(p.id);
    if (url && $('d-cover')) $('d-cover').innerHTML = `<img src="${url}" alt="">`;
  }

  // Übestellen aus den Klammern: was am längsten nicht geübt wurde, zuerst
  function renderSpots() {
    const lib = NL.lib.read(), list = [];
    Object.values(lib.pieces).filter(p => !p.deleted).forEach(p => Object.entries(p.spots || {}).forEach(([id, sp]) => { if (!sp.done) list.push({ p, id, sp }); }));
    list.sort((a, b) => (a.sp.last || 0) - (b.sp.last || 0));
    $('spots-card').hidden = !list.length;
    $('spots-icon').innerHTML = I('clock');
    $('focus-icon').innerHTML = I('clock');
    NL.timer.mount($('focus'), { kind: 'card' });
    document.addEventListener('nl-timer-done', renderStats);
    $('spotlist').innerHTML = list.slice(0, 4).map(({ p, id, sp }) => `<a href="bibliothek.html#spot-${p.id}-${id}"><b>${esc(sp.name)} · ${esc(p.title)}</b><span>heute <b>${sp.cur}</b> bpm, Ziel ${sp.target}</span></a>`).join('');
  }
  renderDaily();
  renderSpots();
  document.addEventListener('nl-synced', () => { renderDaily(); renderSpots(); });
  renderStats();
  renderKonto();
  document.addEventListener('nl-status', renderKonto);
  document.addEventListener('nl-synced', renderStats);
  window.addEventListener('storage', renderStats);
  if (location.hash === '#konto') setTimeout(() => $('konto').scrollIntoView({ block: 'start' }), 50);
})();
</script>
